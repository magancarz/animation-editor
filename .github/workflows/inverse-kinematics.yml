name: inverse-kinematics

on:
  push:

jobs:
  tests:
    strategy:
      fail-fast: true
    runs-on: ubuntu-24.04
    name: Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y g++ cmake make

      - name: Fetch submodules
        run: |
          git submodule update --init --recursive

      - name: Build
        run: |
          mkdir Debug
          cmake -B Debug -S . -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build Debug -j $(nproc --all)

      - name: Run tests
        run: |
          ctest --test-dir Debug/Tests
